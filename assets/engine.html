    if(!vig)makeVig();ctx.fillStyle=vig;ctx.fillRect(0,0,W,H);
    frozen=null;frozenBlur=null;
  }else if(inEnd){if(!frozenBlur)makeFrozen();drawEndcard(ctx)}
  else{renderer.render(scene,camera);ctx.drawImage(renderer.domElement,0,0,W,H);drawTitle(ctx,STORY.meta.title,STORY.meta.highlight,1)}
  document.getElementById("fill").style.width=(playing?t/total*100:0)+"%";
  document.getElementById("time").textContent=(playing?t.toFixed(1):"0.0")+"s / "+total+"s";
}
function startPlay(){
  if(runGain){try{runGain.gain.cancelScheduledValues(0);runGain.gain.value=0;runGain.disconnect()}catch(e){}}
  talkLast={};
  if(document.getElementById("aud").checked){initAudio();if(AC.state==="suspended")AC.resume();
    runGain=AC.createGain();runGain.gain.value=0;runGain.connect(AC.destination);
    const rd=AC.createMediaStreamDestination();runGain.connect(rd);runGain.userData=rd;
    master.connect(runGain);
    const t0=AC.currentTime+.1;
    runGain.gain.linearRampToValueAtTime(.18,t0+1.2);
    runGain.gain.setValueAtTime(.18,t0+total-4.5);runGain.gain.linearRampToValueAtTime(.12,t0+total-4.5);
    runGain.gain.linearRampToValueAtTime(.0001,t0+total-.2);
    buildMusic(t0).forEach(ev=>schedule(ev[1],ev[0],ev[2],ev[3]));
    window._rd=rd}
  playing=true;startT=performance.now();
  document.getElementById("play").disabled=true;document.getElementById("rec").disabled=true}
function stopAll(){playing=false;document.getElementById("play").disabled=false;document.getElementById("rec").disabled=false;
  if(recorder&&recorder.state==="recording"){recorder.stop();recording=false}}
document.getElementById("play").onclick=()=>{startPlay();setStatus("Main…")}
document.getElementById("stop").onclick=()=>{stopAll();setStatus("Dihentikan.")}
document.getElementById("rec").onclick=()=>{
  const wantAud=document.getElementById("aud").checked;
  startPlay();
  const stream=out.captureStream(30);
  if(wantAud&&window._rd)window._rd.stream.getAudioTracks().forEach(tr=>stream.addTrack(tr));
  const mimes=["video/mp4","video/webm;codecs=vp9","video/webm;codecs=vp8","video/webm"];
  const mime=mimes.find(m=>window.MediaRecorder&&MediaRecorder.isTypeSupported(m))||"";
  if(!mime){setStatus("Browser tak sokong rakam. Guna Chrome terkini.");return}
  chunks=[];recorder=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:6e6});
  recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
  recorder.onstop=()=>{const ext=mime.includes("mp4")?"mp4":"webm";
    const blob=new Blob(chunks,{type:mime});const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);a.download=(STORY.meta.title||"story").toLowerCase().replace(/[^a-z0-9]+/g,"-").slice(0,40)+"."+ext;
    a.click();setStatus("Siap! Video ."+ext+" dimuat turun. CapCut → mp4 → TikTok.")};
  recorder.start();recording=true;
  setStatus("Merakam… jangan keluar tab / skrin jaga ⚠️");
  setTimeout(()=>{if(recording)stopAll()},(total+1)*1000)};
function setStatus(s){document.getElementById("status").textContent=s}
function loadStory(obj){STORY=obj;calcTotal();loadChars();frozen=null;frozenBlur=null;vig=null;setStatus("Dimuatkan: "+obj.meta.title)}
document.getElementById("load").onclick=()=>{try{const o=JSON.parse(document.getElementById("json").value);
  if(!o.shots||!o.characters)throw 0;loadStory(o)}catch(e){setStatus("JSON tak sah — semak semula.")}};
document.getElementById("ex").onclick=()=>{document.getElementById("json").value=JSON.stringify(EXAMPLE,null,1);loadStory(EXAMPLE)};
document.getElementById("res").onchange=e=>{W=+e.target.value;H=W*16/9;out.width=W;out.height=H;renderer.setSize(W,H,false);
  renderer.shadowMap.enabled=W<=720;scene.traverse(m=>{if(m.isMesh&&m.material)m.material.needsUpdate=true});
  frozen=null;frozenBlur=null;vig=null};
loadChars();calcTotal();
document.fonts.ready.then(()=>requestAnimationFrame(frame));
</script>
